[blog]
image="ghcr.io/ublue-os/arch-toolbox:latest"
home="$HOME/.distrobox/homes/blog"
pull=true
replace=true

pre_init_hooks="echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && pacman -Syu --noconfirm"

additional_packages="base base-devel wget curl bash-completion bc chezmoi"
additional_packages="fzf fd git glibc neovim npm nodejs ripgrep rsync ruby ruby-bundler"
additional_packages="ruby-erb jekyll tree tree-sitter"

init_hooks="mkdir -p ${HOME}/.distrobox/homes/blog/.local/share/gem && chmod -R ugo+rwx ${HOME}/.distrobox/homes/blog/.local/share/gem && chezmoi init --apply --no-tty --force https://github.com/derekbarbosa/dotfiles-chezmoi.git --branch blogdev && nvim -f --headless -c ':Lazy install' +MasonToolsInstallSync +qall"
