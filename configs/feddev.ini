[feddev]
image="fedora:latest"
pre_init_hooks=dnf upgrade
additional_packages="bash-completion chezmoi git"
additional_packages="ripgrep fzf nodejs compat-lua luajit luarocks neovim"
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/crun;
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/flatpak;
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman;
init_hooks=dnf group install 'Development Tools';
init_hooks=dnf group install 'C Development Tools and Libraries';
pull=true
replace=true
